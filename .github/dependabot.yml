# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Asia/Tokyo"
    # Keep minor/patch only. Security updates are not affected by this ignore.
    #
    # Why (esp. ESLint majors): Next.js + eslint-config-next is not ready for
    # ESLint 10. See https://github.com/vercel/next.js/issues/89764
    # - eslint-plugin-react (pulled in by eslint-config-next) still calls the
    #   removed context.getFilename() when settings.react.version is "detect",
    #   so rules like react/display-name crash with:
    #   TypeError: contextOrFilename.getFilename is not a function
    # - Even after pinning react.version, a second failure appears:
    #   scopeManager.addGlobals is not a function — Next's vendored
    #   @babel/eslint-parser predates ESLint 10's ScopeManager API, and Babel 7
    #   will not support ESLint 10 (needs Babel 8).
    # Until upstream lands proper support, avoid Dependabot major bumps.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      turbo:
        patterns:
          - "turbo"
          - "@turbo/*"
          - "eslint-plugin-turbo"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
      remark:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "unified"
          - "remark-*"
          - "mdast-*"
          - "rehype-*"
          - "unist-*"
          - "@vcarl/remark-headings"
          - "@types/mdast"
          - "@types/rehype"
          - "@types/rehype-*"
          - "@types/remark"
          - "@types/remark-*"
